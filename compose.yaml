# Meldgrove Library in production: one image, three services, and the PostgreSQL 18 in
# DATABASE_URL.
#
#   cp .env.example .env    # then set the production values, see docs/configuration.md
#   docker compose up -d
#
# LIBRARY_VERSION in .env selects the release of ghcr.io/meldgrove/library,
# e.g. 0.1.0. To upgrade, read the release notes, change it, and run
# `docker compose up -d` again. A tag that moves (0.1, latest) lets `updater`
# install new releases (docs/deployment.md, Automatic updates). On a
# platform that does not pull images when it deploys, PULL_POLICY=always
# makes every start pull them again.
#
# Without a PostgreSQL of your own, add compose.postgres.yaml: it runs one
# next to the library (docs/deployment.md).
#
# Put a TLS-terminating reverse proxy in front of `web` (127.0.0.1:3000 on the
# host; LIBRARY_PORT changes the port) and set LIBRARY_BASE_URL to its public
# URL. `migrate` runs once before `web` and
# `worker` start. Platforms that run Compose files (e.g. Coolify, Portainer)
# can use this file as it is; set the variables in their environment view. A
# platform that reads the file from the repository follows the branch
# `stable`, which is at the newest release; `main` has unreleased changes.
# Local development uses compose.dev.yaml.

x-image: &image ghcr.io/meldgrove/library:${LIBRARY_VERSION:?set LIBRARY_VERSION in .env to a release, e.g. 0.1.0}

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?}
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-directory-environment: &directory-environment
  LIBRARY_BASE_URL: ${LIBRARY_BASE_URL:?}
  OIDC_ISSUER: ${OIDC_ISSUER:?}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
  DIRECTORY: ${DIRECTORY:-manual}
  INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
  KEYCLOAK_ACCESS_GROUP: ${KEYCLOAK_ACCESS_GROUP:-}
  KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP:-}
  KEYCLOAK_TEAMS_GROUP: ${KEYCLOAK_TEAMS_GROUP:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

# Originals: an S3-compatible bucket, or the `originals` volume
# with STORAGE_DRIVER=filesystem.
x-storage-environment: &storage-environment
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_DIR: ${STORAGE_DIR:-/data/originals}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-}

# Error reporting to Sentry; off without SENTRY_DSN.
x-error-reporting-environment: &error-reporting-environment
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}

services:
  migrate:
    image: *image
    pull_policy: ${PULL_POLICY:-missing}
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *app-environment

  web:
    image: *image
    pull_policy: ${PULL_POLICY:-missing}
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # The host port for a reverse proxy on the host. Platforms with their own
      # proxy reach `web` over the Docker network; set LIBRARY_PORT to any free
      # port when 3000 is taken.
      - "127.0.0.1:${LIBRARY_PORT:-3000}:3000"
    volumes:
      - originals:/data/originals
    environment:
      <<: [*app-environment, *directory-environment, *storage-environment, *error-reporting-environment]
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      # The Slack bot's events; off without it (docs/configuration.md).
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    healthcheck:
      # Readiness: database reachable and migrations applied.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: *image
    pull_policy: ${PULL_POLICY:-missing}
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - originals:/data/originals
    environment:
      <<: [*app-environment, *directory-environment, *storage-environment, *error-reporting-environment]
      # The AI model that drafts notes (docs/configuration.md).
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      # The webhook; off without WEBHOOK_URL (docs/webhooks.md).
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Text recognition for scanned PDFs; the image includes ocrmypdf.
      OCR_COMMAND: ${OCR_COMMAND:-ocrmypdf}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-}
      # Each channel is off until it is configured.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SMTP_URL: ${SMTP_URL:-}
      MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      # The weekly digest for everyone; teams set their own channel in the library.
      DIGEST_SLACK_CHANNEL_ID: ${DIGEST_SLACK_CHANNEL_ID:-}
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}
      # The intake mailbox; off without EMAIL_INTAKE_IMAP_URL (docs/configuration.md).
      EMAIL_INTAKE_IMAP_URL: ${EMAIL_INTAKE_IMAP_URL:-}
      EMAIL_INTAKE_DOMAINS: ${EMAIL_INTAKE_DOMAINS:-}
      EMAIL_INTAKE_MAILBOX: ${EMAIL_INTAKE_MAILBOX:-}
      EMAIL_INTAKE_DONE_MAILBOX: ${EMAIL_INTAKE_DONE_MAILBOX:-}
    healthcheck:
      # The worker refreshes its heartbeat file every 30 seconds.
      test: ["CMD", "node", "dist/worker-healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Automatic updates (docs/deployment.md): off until UPDATE_DEPLOY_HOOK_URL
  # is set. When the tag in LIBRARY_VERSION points to a new image, it calls
  # that deploy link, and the platform deploys the new release.
  updater:
    image: ghcr.io/meldgrove/updater:0.1
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      IMAGE: *image
      DEPLOY_HOOK_URL: ${UPDATE_DEPLOY_HOOK_URL:-}
      DEPLOY_HOOK_TOKEN: ${UPDATE_DEPLOY_HOOK_TOKEN:-}
      # A release installs once it has been out this long, and only inside
      # the window, if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}

volumes:
  # Only used with STORAGE_DRIVER=filesystem.
  originals:
