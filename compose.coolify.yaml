# Meldgrove Library on Coolify only (docs/coolify.md); on a server, use
# compose.yaml. Coolify reads this file from the branch `stable`, which is at
# the newest release.
#
# Keep it in step with compose.yaml. It differs only in three points: `web`
# publishes no port, only `expose:` 3000 (Coolify's proxy reaches it over the Docker network; assign
# the domain to `web`, port 3000), every deploy pulls the images again (the tag
# in LIBRARY_VERSION moves: a series such as 0.2, latest or preview), and
# `updater` calls Coolify's deploy link.
#
# PostgreSQL is a separate Coolify resource; set DATABASE_URL to its internal
# URL and LIBRARY_BASE_URL to the domain. Set the variables in the resource's
# environment view.

x-image: &image ghcr.io/meldgrove/library:${LIBRARY_VERSION:?set LIBRARY_VERSION in .env to a release, e.g. 0.1.0}

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?}
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The update button for admins asks `updater` (docs/configuration.md),
  # with UPDATER_TOKEN (openssl rand -hex 32), which the updater then requires.
  UPDATER_URL: ${UPDATER_URL:-http://updater:8080}
  UPDATER_TOKEN: ${UPDATER_TOKEN:-}

x-directory-environment: &directory-environment
  LIBRARY_BASE_URL: ${LIBRARY_BASE_URL:?}
  OIDC_ISSUER: ${OIDC_ISSUER:?}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
  DIRECTORY: ${DIRECTORY:-manual}
  INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
  KEYCLOAK_ACCESS_GROUP: ${KEYCLOAK_ACCESS_GROUP:-}
  KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP:-}
  KEYCLOAK_MAINTAINER_GROUP: ${KEYCLOAK_MAINTAINER_GROUP:-}
  KEYCLOAK_TEAMS_GROUP: ${KEYCLOAK_TEAMS_GROUP:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

# Originals: an S3-compatible bucket, or the `originals` volume
# with STORAGE_DRIVER=filesystem. Without any S3_* variable, storage is off and
# the library takes links only.
x-storage-environment: &storage-environment
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_DIR: ${STORAGE_DIR:-/data/originals}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-}

# Up to 0.3.2, Slack, email, the AI model, the webhook, the weekly digest and the
# intake mailbox were set here. They are settings in the database now
# (Admin › Integrations, or `cli settings`, docs/deployment.md). The worker
# still gets the old variables so that it copies them into the database once
# (images up to 0.3.2 read them too); then the admin page and
# `cli settings list` say to delete them from .env.
x-moved-environment: &moved-environment
  AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SMTP_URL: ${SMTP_URL:-}
  MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:-}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
  DIGEST_SLACK_CHANNEL_ID: ${DIGEST_SLACK_CHANNEL_ID:-}
  DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}
  EMAIL_INTAKE_IMAP_URL: ${EMAIL_INTAKE_IMAP_URL:-}
  EMAIL_INTAKE_DOMAINS: ${EMAIL_INTAKE_DOMAINS:-}
  EMAIL_INTAKE_MAILBOX: ${EMAIL_INTAKE_MAILBOX:-}
  EMAIL_INTAKE_DONE_MAILBOX: ${EMAIL_INTAKE_DONE_MAILBOX:-}

# Error reporting to Sentry; off without SENTRY_DSN.
x-error-reporting-environment: &error-reporting-environment
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}

services:
  migrate:
    image: *image
    pull_policy: always
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *app-environment
      # Opens the secrets of the settings for `cli settings`, which runs in
      # this service: docker compose run --rm -T migrate cli settings list
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}

  web:
    image: *image
    pull_policy: always
    command: ["web"]
    restart: unless-stopped
    # Coolify takes the proxy port from here when the domain names none.
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - originals:/data/originals
    environment:
      <<: [*app-environment, *directory-environment, *storage-environment, *error-reporting-environment]
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      # Moved into the database after 0.3.2 (see x-moved-environment).
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    healthcheck:
      # Readiness: database reachable and migrations applied.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: *image
    pull_policy: always
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - originals:/data/originals
    environment:
      <<: [*app-environment, *directory-environment, *storage-environment, *error-reporting-environment, *moved-environment]
      # Opens the secrets of the settings in the database.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      # Limits on the AI model (docs/configuration.md); the model itself is a setting.
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      # Text recognition for scanned PDFs; the image includes ocrmypdf.
      OCR_COMMAND: ${OCR_COMMAND:-ocrmypdf}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-}
    healthcheck:
      # The worker refreshes its heartbeat file every 30 seconds.
      test: ["CMD", "node", "dist/worker-healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Automatic updates and the update button (docs/coolify.md). It checks for
  # new versions every hour and answers the library on port 8080 of the
  # Compose network; never publish that port. With UPDATER_TOKEN set, its API
  # takes only requests that carry it, as the library's do.
  # With UPDATE_DEPLOY_HOOK_URL set, it calls Coolify's deploy link when the
  # tag in LIBRARY_VERSION points to a new image: the tag decides what
  # installs, so admins cannot choose the channel in the library.
  updater:
    image: ghcr.io/meldgrove/updater:0.2
    pull_policy: always
    restart: unless-stopped
    environment:
      IMAGE: *image
      VERSION_VARIABLE: LIBRARY_VERSION
      # Empty: the API takes requests from anything on the Compose network.
      API_TOKEN: ${UPDATER_TOKEN:-}
      DEPLOY_HOOK_URL: ${UPDATE_DEPLOY_HOOK_URL:-}
      DEPLOY_HOOK_TOKEN: ${UPDATE_DEPLOY_HOOK_TOKEN:-}
      # A stable release installs once it has been out this long, and only
      # inside the window, if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      # Only for a private copy of the image.
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
    volumes:
      - updater:/trigger

  # Backups for Meldgrove Backups (docs/deployment.md#backups): the database and
  # the `originals` volume, sent when Backups asks. Idle while BACKUP_URL is
  # empty; it only reads and opens no port.
  backup-agent:
    image: ghcr.io/meldgrove/backup-agent:0.1
    pull_policy: always
    restart: unless-stopped
    # The app's user, so that the agent reads every file the app writes.
    user: "1000:1000"
    environment:
      # From the app's source in Meldgrove Backups. Empty: the agent idles.
      BACKUP_URL: ${BACKUP_URL:-}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:?}
      APP_NAME: library
      APP_IMAGE: *image
      # Settings a restore needs that are not in the backup (names only).
      APP_SECRETS: BETTER_AUTH_SECRET
    volumes:
      - originals:/data/originals:ro

volumes:
  # Only used with STORAGE_DRIVER=filesystem.
  originals:
  # The updater's state.
  updater:
